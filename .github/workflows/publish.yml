name: Build & Publish Package

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Always build & lint the package, on every push and every release.
  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest
    permissions:
      attestations: write # necessary for GitHub build provenance attestations
      id-token: write # necessary for GitHub build provenance attestations
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # hatch-vcs needs the full history/tags to compute the version

      - uses: hynek/build-and-inspect-python-package@v2
        with:
          attest-build-provenance-github: "true"

  # Publish every commit on main as a dev build to Test PyPI, so the package
  # can be installed and sanity-checked before it's ever cut into a release.
  release-test-pypi:
    name: Publish in-dev package to test.pypi.org
    if: github.repository_owner == 'mersal-org' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-package
    environment: release-test-pypi
    permissions:
      id-token: write # necessary for trusted publishing
    steps:
      - name: Download packages built by build-and-inspect-python-package
        uses: actions/download-artifact@v7
        with:
          name: Packages
          path: dist

      - name: Upload package to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # Publish to the real PyPI whenever a GitHub Release is published.
  release-pypi:
    name: Publish released package to pypi.org
    if: github.repository_owner == 'mersal-org' && github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: build-package
    environment: release
    permissions:
      id-token: write # necessary for trusted publishing
    steps:
      - name: Download packages built by build-and-inspect-python-package
        uses: actions/download-artifact@v7
        with:
          name: Packages
          path: dist

      - name: Upload package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

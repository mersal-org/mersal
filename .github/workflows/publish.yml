name: Build & Publish Package

on:
  workflow_run:
    workflows: ["Tests And Linting"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.4), without the leading 'v'"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Build & lint the package, once CI has passed on main, and on every release.
  build-package:
    name: Build & verify package
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      attestations: write # necessary for GitHub build provenance attestations
      id-token: write # necessary for GitHub build provenance attestations
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # hatch-vcs needs the full history/tags to compute the version

      - uses: hynek/build-and-inspect-python-package@v2.18.0
        env:
          # On a real release, stamp the exact version we're about to publish
          # without the tag existing yet -- hatch-vcs (via setuptools_scm)
          # honors this override. On push-to-main dev builds this is empty,
          # so the version keeps deriving from the most recent tag as usual.
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}
        with:
          attest-build-provenance-github: "true"

  # Publish every commit on main as a dev build to Test PyPI, so the package
  # can be installed and sanity-checked before it's ever cut into a release.
  # Gated on the "Tests And Linting" workflow having passed for that commit.
  release-test-pypi:
    name: Publish in-dev package to test.pypi.org
    if: >
      github.repository_owner == 'mersal-org' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: build-package
    environment: release-test-pypi
    permissions:
      id-token: write # necessary for trusted publishing
    steps:
      - name: Download packages built by build-and-inspect-python-package
        uses: actions/download-artifact@v8
        with:
          name: Packages
          path: dist

      - name: Upload package to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # Publish to the real PyPI on a manually dispatched release run.
  release-pypi:
    name: Publish released package to pypi.org
    if: github.repository_owner == 'mersal-org' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build-package
    environment: release
    permissions:
      id-token: write # necessary for trusted publishing
    steps:
      - name: Download packages built by build-and-inspect-python-package
        uses: actions/download-artifact@v8
        with:
          name: Packages
          path: dist

      - name: Upload package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  # Only once PyPI publishing has actually succeeded do we tag the commit and
  # create the GitHub Release -- the tag is a record of what shipped, not a
  # trigger for shipping it.
  tag-and-release:
    name: Tag release and create GitHub Release
    if: github.repository_owner == 'mersal-org' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: release-pypi
    permissions:
      contents: write # necessary to push the tag and create the release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so --generate-notes can find the previous tag

      - name: Tag and push
        run: |
          git tag "v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.event.inputs.version }}" --generate-notes

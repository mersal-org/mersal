[project]
name = "mersal"
version = "0.1.0"
description = "A service bus library."
authors = [
    { name = "Abdulhaq Emhemmed", email = "abdulhaq.emhemmed@gmail.com" }
]
dependencies = [
    "anyio>=4.8.0",
]
readme = "README.rst"
requires-python = ">= 3.10"

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development",
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Topic :: Internet",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[dependency-groups]
build = ["bump-my-version"]
dev = [
  { include-group = "build" },
  { include-group = "docs" },
  { include-group = "linting" },
  { include-group = "test" },
]
docs = [
    "furo",
    "sphinx",
    "sphinx-autobuild",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinxcontrib-bibtex",
    "sphinxcontrib-mermaid",
    "sphinx-paramlinks",
    "sphinx-togglebutton",
    'mersal',
    'sqlalchemy',
    'mersal_msgspec',
    'mersal_sqlalchemy',
    'mersal_polling',
    'mersal_litestar',
]
linting = [
    "basedpyright>=1.28.1",
    "mypy>=1.15.0",
    "pre-commit",
    "ruff",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "anyio",
    "time-machine",
]

[tool.uv]
managed = true

[tool.uv.workspace]
members = ["docs/examples"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
filterwarnings = [
    "ignore::DeprecationWarning",
]
log_cli = true

[tool.ruff]
include = [
  "mersal/**/*.{py,pyi}",
  "testing/**/*.{py,pyi}",
  "tests/**/*.{py,pyi}",
  "docs/examples/**/*.{py,pyi}",
  "pyproject.toml"
]
target-version = "py310"
line-length = 120

src = [
  "mersal",
  "testing",
  "tests",
  "docs/examples/src",
  "docs/examples/tests"
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/testing/**/*.py" = [
  "S101", # flake8-bandit - use of assert detected
]
"mersal/threading/__init__.py" = [
  "A005", # lake8-builtins - stdlib-module-shadowing
]
"mersal/types/__init__.py" = [
  "A005", # lake8-builtins - stdlib-module-shadowing
]
"tests/profile.py" = [
  "A005", # lake8-builtins - stdlib-module-shadowing
]
"**/tests/**/*.py" = [
  "B017", # flake8-bugbear - assert-raises-exception
  "N818", # pep8-naming - error-suffix-on-exception-name
  "S101", # flake8-bandit - use of assert detected
]
"**/*/conftest.py" = [
  "F403", # Pyflakes - undefined-local-with-import-star
]
# "examples/**/*.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = [
"mersal",
"mersal_testing",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mersal", "testing/mersal_testing"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
dev-mode-dirs = ["."]
exclude = ["/.github", "/docs"]

# Type checking configuration
[tool.mypy]
python_version = "3.10"
enable_error_code = [
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-self",
]
packages = [
  "mersal",
  "mersal_testing",
]
disallow_any_generics = false
local_partial_types = true
show_error_codes = true
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
  "mersal.sagas.saga",
]
warn_unused_ignores = false

# [[tool.mypy.overrides]]
# module = "tests.*"
# disallow_untyped_defs = false
# disallow_incomplete_defs = false

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.10"
include = [
  "mersal",
  "testing",
  "tests",
]

[tool.interrogate]
omit-covered-files = true
verbose = 2
fail-under = 1
whitelist-regex = ["test_.*"]
